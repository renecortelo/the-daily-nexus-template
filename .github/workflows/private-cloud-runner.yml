name: Private cloud runner

on:
  workflow_dispatch:
    inputs:
      clock_schedule_id:
        description: "Opaque exact saved schedule id from the private cloud clock."
        required: false
        type: string
      clock_schedule_date:
        description: "Local YYYY-MM-DD occurrence for the exact clock schedule."
        required: false
        type: string
      clock_source:
        description: "Private clock provenance marker. Leave blank for a manual queue run."
        required: false
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: private-daily-nexus-runner
  cancel-in-progress: false

jobs:
  run-private-queue:
    if: github.repository_visibility == 'private'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      AGY_CLI_HIDE_ACCOUNT_INFO: "1"
      DO_NOT_TRACK: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      PYTHONUTF8: "1"
      TDN_REPOSITORY_VISIBILITY: ${{ github.repository_visibility }}
      TDN_SCHEDULE_ID: ${{ inputs.clock_schedule_id || '' }}
      TDN_SCHEDULE_DATE: ${{ inputs.clock_schedule_date || '' }}
      TDN_CLOCK_SOURCE: ${{ inputs.clock_source || '' }}
    steps:
      - name: Reserve time for protected shutdown
        shell: bash
        run: |
          runner_started=$(date +%s)
          echo "TDN_RUNNER_STARTED_EPOCH=$runner_started" >> "$GITHUB_ENV"
          echo "TDN_RUNNER_DEADLINE_EPOCH=$(( runner_started + 55 * 60 ))" >> "$GITHUB_ENV"

      - name: Check out the private deployment
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: uv.lock

      - name: Materialize the queue-only credential
        env:
          TDN_FIREBASE_REFRESH_TOKEN: ${{ secrets.TDN_FIREBASE_REFRESH_TOKEN }}
          TDN_FIREBASE_PROJECT_ID: ${{ secrets.TDN_FIREBASE_PROJECT_ID }}
          TDN_FIREBASE_API_KEY: ${{ secrets.TDN_FIREBASE_API_KEY }}
          TDN_FIREBASE_OWNER_UID: ${{ secrets.TDN_FIREBASE_OWNER_UID }}
          TDN_SPARK_CONFIRMED: ${{ secrets.TDN_SPARK_CONFIRMED }}
        run: >-
          PYTHONPATH=src python -m audiodigest.cloud_runtime prepare
          --phase probe
          --template config.cloud.example.toml
          --output config.toml.cloud

      - name: Check the owner-only queue
        id: probe
        shell: bash
        run: |
          probe_args=(python -m audiodigest.cloud_probe --config config.toml.cloud)
          if [[ -n "${TDN_SCHEDULE_ID:-}" ]]; then
            if [[ -z "${TDN_SCHEDULE_DATE:-}" ]]; then
              echo "A private clock schedule id requires its local schedule date." >&2
              exit 1
            fi
            probe_args+=(--schedule-id "$TDN_SCHEDULE_ID" --schedule-date "$TDN_SCHEDULE_DATE")
          elif [[ -n "${TDN_SCHEDULE_DATE:-}" ]]; then
            echo "A private clock schedule date requires its schedule id." >&2
            exit 1
          fi
          PYTHONPATH=src "${probe_args[@]}"

      - name: Remove the queue credential before installing dependencies
        if: always()
        run: >-
          PYTHONPATH=src python -m audiodigest.cloud_runtime cleanup
          --config config.toml.cloud

      - name: Restore the public voice-model cache
        if: steps.probe.outputs.run == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/huggingface
          key: tdn-linux-voice-models-v1

      - name: Install the FFmpeg and private keyring runtimes
        if: steps.probe.outputs.run == 'true'
        shell: bash
        run: |
          sudo apt-get update --quiet
          sudo apt-get install --yes --no-install-recommends \
            dbus-x11 \
            ffmpeg \
            gnome-keyring \
            libsecret-tools

      - name: Set up Node LTS
        if: steps.probe.outputs.run == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"

      - name: Install the local generation runtime
        if: steps.probe.outputs.run == 'true'
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check "pip==26.2.1" "uv==0.12.23"
          uv sync --frozen --extra audio --python 3.12
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          npm ci --ignore-scripts --no-fund --no-audit
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
          echo "NODE_PATH=$PWD/node_modules" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.local/tdn-tools"
          archive="$RUNNER_TEMP/agy_cli_linux_x64.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            'https://github.com/google-antigravity/antigravity-cli/releases/download/1.3.0/agy_cli_linux_x64.tar.gz' \
            --output "$archive"
          echo '54731cc8ed8fe4a1840c38626b7e3251c6dc4484387f98005dba682507f495be  '"$archive" \
            | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/antigravity" "$HOME/.local/tdn-tools/agy"
          ffmpeg -version >/dev/null
          ffprobe -version >/dev/null

      - name: Materialize encrypted generation credentials
        if: steps.probe.outputs.run == 'true'
        env:
          TDN_GMAIL_TOKEN_JSON: ${{ secrets.TDN_GMAIL_TOKEN_JSON }}
          TDN_FIREBASE_REFRESH_TOKEN: ${{ secrets.TDN_FIREBASE_REFRESH_TOKEN }}
          TDN_ANTIGRAVITY_KEYRING_JSON: ${{ secrets.TDN_ANTIGRAVITY_KEYRING_JSON }}
          TDN_FIREBASE_DEPLOY_TOKEN: ${{ secrets.TDN_FIREBASE_DEPLOY_TOKEN }}
          TDN_FIREBASE_PROJECT_ID: ${{ secrets.TDN_FIREBASE_PROJECT_ID }}
          TDN_FIREBASE_API_KEY: ${{ secrets.TDN_FIREBASE_API_KEY }}
          TDN_FIREBASE_OWNER_UID: ${{ secrets.TDN_FIREBASE_OWNER_UID }}
          TDN_FIREBASE_SECRET_PATH: ${{ secrets.TDN_FIREBASE_SECRET_PATH }}
          TDN_SPARK_CONFIRMED: ${{ secrets.TDN_SPARK_CONFIRMED }}
        run: >-
          PYTHONPATH=src python -m audiodigest.cloud_runtime prepare
          --phase run
          --template config.cloud.example.toml
          --output config.toml.cloud

      - name: Deploy the owner-only Firestore rules
        if: steps.probe.outputs.run == 'true'
        env:
          FIREBASE_TOKEN: ${{ secrets.TDN_FIREBASE_DEPLOY_TOKEN }}
          TDN_FIREBASE_PROJECT_ID: ${{ secrets.TDN_FIREBASE_PROJECT_ID }}
        shell: bash
        run: >-
          firebase deploy --only firestore:rules
          --project "$TDN_FIREBASE_PROJECT_ID"
          --non-interactive

      - name: Generate and publish a protected queue batch
        id: generate
        if: steps.probe.outputs.run == 'true'
        env:
          # This is a public HTTPS endpoint, kept as a secret only so the
          # private deployment identity is never committed to source.
          TDN_CLOUD_CLOCK_URL: ${{ secrets.TDN_CLOUD_CLOCK_URL }}
        shell: bash
        run: bash scripts/run-private-cloud.sh

      - name: Remove temporary credentials
        if: always()
        run: >-
          PYTHONPATH=src python -m audiodigest.cloud_runtime cleanup
          --config config.toml.cloud

      # Every trigger type can continue only after its protected generation
      # batch has finished and all generation credentials are gone. A clock
      # run still owns exactly one occurrence above; this continuation creates
      # a fresh generic workflow without clock inputs for other due schedules
      # or manually queued work.
      - name: Materialize the continuation queue-only credential
        id: continuation_prepare
        if: always() && steps.probe.outputs.run == 'true'
        env:
          TDN_FIREBASE_REFRESH_TOKEN: ${{ secrets.TDN_FIREBASE_REFRESH_TOKEN }}
          TDN_FIREBASE_PROJECT_ID: ${{ secrets.TDN_FIREBASE_PROJECT_ID }}
          TDN_FIREBASE_API_KEY: ${{ secrets.TDN_FIREBASE_API_KEY }}
          TDN_FIREBASE_OWNER_UID: ${{ secrets.TDN_FIREBASE_OWNER_UID }}
          TDN_SPARK_CONFIRMED: ${{ secrets.TDN_SPARK_CONFIRMED }}
        run: >-
          PYTHONPATH=src python -m audiodigest.cloud_runtime prepare
          --phase probe
          --template config.cloud.example.toml
          --output config.toml.cloud

      - name: Check for a remaining generic queue batch
        id: continuation_probe
        if: always() && steps.continuation_prepare.outcome == 'success'
        shell: bash
        run: >-
          PYTHONPATH=src python -m audiodigest.cloud_probe
          --config config.toml.cloud

      - name: Remove continuation queue credential
        if: always() && steps.continuation_prepare.outcome == 'success'
        run: >-
          PYTHONPATH=src python -m audiodigest.cloud_runtime cleanup
          --config config.toml.cloud

      - name: Dispatch a remaining generic queue batch
        if: >-
          always()
          && steps.continuation_probe.outputs.run == 'true'
          && steps.generate.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_REF: ${{ github.ref_name }}
        shell: bash
        run: |
          workflow_state="$(gh api \
            "/repos/${GH_REPO}/actions/workflows/private-cloud-runner.yml" \
            --jq '.state')"
          if [[ "$workflow_state" != "active" ]]; then
            echo "The private runner workflow is not active; continuation was not dispatched." >&2
            exit 1
          fi
          gh api --method POST \
            "/repos/${GH_REPO}/actions/workflows/private-cloud-runner.yml/dispatches" \
            -f "ref=${GH_REF}"

      - name: Report a terminal generation failure
        if: always() && steps.generate.outputs.task_failed == 'true'
        shell: bash
        run: |
          echo "A claimed generation task failed after its terminal status was recorded." >&2
          exit 1
