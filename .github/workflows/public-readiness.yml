name: Public readiness

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  audit-and-test:
    if: github.repository_visibility == 'public' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # GitHub's temporary PR merge commit has account-profile metadata
          # that is not part of the public candidate. Audit the contributor's
          # real head history; strict branch protection still requires it to be
          # current with main before merge.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install the pinned independent secret scanner
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        shell: bash
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" \
            --output "$RUNNER_TEMP/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar --extract --gzip --file "$RUNNER_TEMP/$archive" --directory "$RUNNER_TEMP" gitleaks
          install -m 0755 "$RUNNER_TEMP/gitleaks" "$RUNNER_TEMP/gitleaks-bin"

      - name: Scan complete history for credentials
        run: |
          "$RUNNER_TEMP/gitleaks-bin" git . --redact --no-banner

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Audit tracked source and complete history
        run: python scripts/audit-public-readiness.py --history --strict-metadata

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Check browser and incremental publisher JavaScript
        run: |
          node --check web/app.js
          node --check web/cloud-clock-config.js
          node --check scripts/firebase-clone-deploy.cjs
          node --check scripts/prepare-web-console-release.cjs
          npm --prefix cloud-clock run check
          npm --prefix cloud-clock test

      - name: Test
        run: python -m unittest discover -s tests
