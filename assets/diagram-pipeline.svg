<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 862" width="380" height="862" role="img" aria-labelledby="pipe-t pipe-d">
  <title id="pipe-t">The Daily Nexus generation pipeline</title>
  <desc id="pipe-d">Eight stages run top to bottom. One: load approved Gmail newsletters for the selected date plus optional daily research. Two: build newsletter-first evidence and enrich it from allowed public pages, applying HTTPS, public-address, response-size and timeout limits, with robots rules checked on the original URL and on every redirect destination. Three: extract, rank, consolidate and deduplicate evidence-backed stories. Four: draft the host script. Five: verify factual support, coverage, structure and repetition, where a rejected script receives up to three verifier-guided repair attempts. The run then branches: stage six writes the newspaper independently from the verified evidence, never by copying the audio script, targeting two pages and permitting at most three; stage seven renders Kokoro multi-voice audio and the timed transcript from the approved script inside the selected private runtime. Both branches rejoin at stage eight, which finalizes locally or publishes to Firebase and then remotely verifies the RSS entry and the media enclosure. An optional band shows the same eight stages running unattended after a Cloudflare alarm or a manual GEN wake-up dispatches a GitHub Actions job in the operator's private repository, ending in Firebase publication and an Apple-compatible feed.</desc>
  <defs>
    <linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd27a"/><stop offset="0.45" stop-color="#ffb43b"/><stop offset="1" stop-color="#e0620f"/></linearGradient>
    <clipPath id="sc"><circle cx="0" cy="0" r="14.2"/></clipPath>
    <marker id="ar" viewBox="0 0 9 9" refX="8.4" refY="4.5" markerWidth="7.5" markerHeight="7.5" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.4,0.7 L8.4,4.5 L0.4,8.3 Z" fill="#f28c18"/></marker>
    <marker id="ac" viewBox="0 0 9 9" refX="8.4" refY="4.5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.4,0.7 L8.4,4.5 L0.4,8.3 Z" fill="#b99160"/></marker>
    <g id="sun">
      <circle cx="0" cy="0" r="16.5" fill="#0d0805" stroke="#f28c18" stroke-width="1.5"/>
      <g clip-path="url(#sc)">
        <circle cx="0" cy="0.5" r="11.5" fill="url(#sg)"/>
        <rect x="-15" y="2.2" width="30" height="1.5" fill="#0d0805"/>
        <rect x="-15" y="5.6" width="30" height="1.9" fill="#0d0805"/>
        <rect x="-15" y="9.4" width="30" height="2.3" fill="#0d0805"/>
        <line x1="-15" y1="-1.6" x2="15" y2="-1.6" stroke="#ffb43b" stroke-width="1"/>
      </g>
      <circle cx="-13.6" cy="-1.6" r="1.7" fill="#ffb43b"/>
      <circle cx="13.6" cy="-1.6" r="1.7" fill="#ffb43b"/>
    </g>
    <style>
      .dsp { font-family: Impact, Haettenschweiler, "Arial Narrow Bold", "Arial Narrow", sans-serif; letter-spacing: 0.04em; }
      .h { font-family: Consolas, "DejaVu Sans Mono", "Courier New", monospace; font-weight: 700; letter-spacing: 0.06em; }
      .k { font-family: Consolas, "DejaVu Sans Mono", "Courier New", monospace; letter-spacing: 0.06em; }
      .b { font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .acc { font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .wire { fill: none; stroke: #f28c18; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .ctl { fill: none; stroke: #b99160; stroke-width: 1.4; stroke-dasharray: 4 3; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="380" height="862" fill="#110b07"/>
  <use href="#sun" x="34" y="36"/>
  <text class="dsp" x="60" y="31" font-size="17" fill="#fff0c7">THE DAILY NEXUS</text>
  <text class="k" x="61" y="46" font-size="8" fill="#b99160">GENERATION PIPELINE / EIGHT STAGES</text>
  <line x1="16" y1="60" x2="364" y2="60" stroke="#70401f"/>
  <rect x="16" y="74" width="348" height="58.7" rx="8" fill="#21130c" stroke="#70401f"/>
  <rect x="29" y="83" width="19" height="15" rx="4.5" fill="#f28c18"/>
  <text class="h" x="38.5" y="94" font-size="9.5" fill="#110b07" text-anchor="middle">1</text>
  <text class="h" x="55" y="94.5" font-size="11" fill="#f4e2b8">COLLECT</text>
  <text class="b" x="29" y="107.6" font-size="9.5" fill="#b99160">Approved Gmail newsletters for the selected date, plus optional daily</text>
  <text class="b" x="29" y="120.7" font-size="9.5" fill="#b99160">research.</text>
  <path class="wire" d="M 190 133.7 L 190 144.7" marker-end="url(#ar)"/>
  <rect x="16" y="146.7" width="348" height="70.8" rx="8" fill="#21130c" stroke="#70401f"/>
  <rect x="29" y="155.7" width="19" height="15" rx="4.5" fill="#f28c18"/>
  <text class="h" x="38.5" y="166.7" font-size="9.5" fill="#110b07" text-anchor="middle">2</text>
  <text class="h" x="55" y="167.2" font-size="11" fill="#f4e2b8">ENRICH SAFELY</text>
  <text class="b" x="29" y="180.3" font-size="9.5" fill="#b99160">Newsletter-first evidence, enriched from allowed public pages.</text>
  <text class="b" x="29" y="192.9" font-size="9" fill="#ffb43b">HTTPS, public-address, response-size and timeout limits. Robots rules are checked</text>
  <text class="b" x="29" y="205.5" font-size="9" fill="#ffb43b">on the original URL and on every redirect destination.</text>
  <path class="wire" d="M 190 218.5 L 190 229.5" marker-end="url(#ar)"/>
  <rect x="16" y="231.5" width="348" height="45.6" rx="8" fill="#21130c" stroke="#70401f"/>
  <rect x="29" y="240.5" width="19" height="15" rx="4.5" fill="#f28c18"/>
  <text class="h" x="38.5" y="251.5" font-size="9.5" fill="#110b07" text-anchor="middle">3</text>
  <text class="h" x="55" y="252" font-size="11" fill="#f4e2b8">RANK STORIES</text>
  <text class="b" x="29" y="265.1" font-size="9.5" fill="#b99160">Extract, rank, consolidate and deduplicate evidence-backed stories.</text>
  <path class="wire" d="M 190 278.1 L 190 289.1" marker-end="url(#ar)"/>
  <rect x="16" y="291.1" width="348" height="45.6" rx="8" fill="#21130c" stroke="#70401f"/>
  <rect x="29" y="300.1" width="19" height="15" rx="4.5" fill="#f28c18"/>
  <text class="h" x="38.5" y="311.1" font-size="9.5" fill="#110b07" text-anchor="middle">4</text>
  <text class="h" x="55" y="311.6" font-size="11" fill="#f4e2b8">DRAFT SCRIPT</text>
  <text class="b" x="29" y="324.7" font-size="9.5" fill="#b99160">Write the solo or two-host dialogue.</text>
  <path class="wire" d="M 190 337.7 L 190 348.7" marker-end="url(#ar)"/>
  <rect x="16" y="350.7" width="348" height="58.2" rx="8" fill="#21130c" stroke="#70401f"/>
  <rect x="29" y="359.7" width="19" height="15" rx="4.5" fill="#f28c18"/>
  <text class="h" x="38.5" y="370.7" font-size="9.5" fill="#110b07" text-anchor="middle">5</text>
  <text class="h" x="55" y="371.2" font-size="11" fill="#f4e2b8">VERIFY</text>
  <text class="b" x="29" y="384.3" font-size="9.5" fill="#b99160">Factual support, coverage, structure and repetition.</text>
  <text class="b" x="29" y="396.9" font-size="9" fill="#ffb43b">A rejected script gets up to three verifier-guided repair attempts.</text>
  <path class="wire" d="M 190 409.9 L 190 421.9"/>
  <path class="wire" d="M 99 421.9 L 281 421.9"/>
  <path class="wire" d="M 99 421.9 L 99 434.9" marker-end="url(#ar)"/>
  <path class="wire" d="M 281 421.9 L 281 434.9" marker-end="url(#ar)"/>
  <rect x="16" y="436.9" width="166" height="97.5" rx="8" fill="#21130c" stroke="#70401f"/>
  <rect x="29" y="445.9" width="19" height="15" rx="4.5" fill="#f28c18"/>
  <text class="h" x="38.5" y="456.9" font-size="9.5" fill="#110b07" text-anchor="middle">6</text>
  <text class="h" x="55" y="457.4" font-size="11" fill="#f4e2b8">NEWSPAPER</text>
  <text class="b" x="29" y="470" font-size="9" fill="#ffb43b">in: verified evidence</text>
  <text class="b" x="29" y="483.1" font-size="9.5" fill="#b99160">Written independently, never by</text>
  <text class="b" x="29" y="496.2" font-size="9.5" fill="#b99160">copying the script.</text>
  <text class="b" x="29" y="509.3" font-size="9.5" fill="#b99160">Two pages target, three</text>
  <text class="b" x="29" y="522.4" font-size="9.5" fill="#b99160">maximum.</text>
  <rect x="198" y="436.9" width="166" height="97.5" rx="8" fill="#21130c" stroke="#70401f"/>
  <rect x="211" y="445.9" width="19" height="15" rx="4.5" fill="#f28c18"/>
  <text class="h" x="220.5" y="456.9" font-size="9.5" fill="#110b07" text-anchor="middle">7</text>
  <text class="h" x="237" y="457.4" font-size="11" fill="#f4e2b8">AUDIO</text>
  <text class="b" x="211" y="470" font-size="9" fill="#ffb43b">in: approved script</text>
  <text class="b" x="211" y="483.1" font-size="9.5" fill="#b99160">Kokoro multi-voice speech and</text>
  <text class="b" x="211" y="496.2" font-size="9.5" fill="#b99160">the timed transcript.</text>
  <text class="b" x="211" y="509.3" font-size="9.5" fill="#b99160">Rendered inside the selected</text>
  <text class="b" x="211" y="522.4" font-size="9.5" fill="#b99160">runtime.</text>
  <path class="wire" d="M 99 535.4 L 99 547.4"/>
  <path class="wire" d="M 281 535.4 L 281 547.4"/>
  <path class="wire" d="M 99 547.4 L 281 547.4"/>
  <path class="wire" d="M 190 547.4 L 190 560.4" marker-end="url(#ar)"/>
  <rect x="16" y="562.4" width="348" height="58.7" rx="8" fill="#21130c" stroke="#70401f"/>
  <rect x="29" y="571.4" width="19" height="15" rx="4.5" fill="#f28c18"/>
  <text class="h" x="38.5" y="582.4" font-size="9.5" fill="#110b07" text-anchor="middle">8</text>
  <text class="h" x="55" y="582.9" font-size="11" fill="#f4e2b8">DELIVER</text>
  <text class="b" x="29" y="596" font-size="9.5" fill="#b99160">Finalize locally, or publish to Firebase and then remotely verify the RSS</text>
  <text class="b" x="29" y="609.1" font-size="9.5" fill="#b99160">entry and the media enclosure.</text>
  <text class="k" x="30" y="661.6" font-size="8.5" fill="#ffb43b">OPTIONAL - THE SAME EIGHT STAGES, UNATTENDED</text>
  <rect x="28" y="668.6" width="324" height="24" rx="6" fill="#2d190e" stroke="#70401f"/>
  <text class="k" x="40" y="684.1" font-size="8.6" fill="#f4e2b8">CLOUDFLARE ALARM, OR A GEN WAKE-UP</text>
  <path class="wire" d="M 190 693.6 L 190 701.6" marker-end="url(#ar)"/>
  <rect x="28" y="703.6" width="324" height="24" rx="6" fill="#2d190e" stroke="#70401f"/>
  <text class="k" x="40" y="719.1" font-size="8.6" fill="#f4e2b8">GITHUB ACTIONS JOB / PRIVATE REPO</text>
  <path class="wire" d="M 190 728.6 L 190 736.6" marker-end="url(#ar)"/>
  <rect x="28" y="738.6" width="324" height="24" rx="6" fill="#2d190e" stroke="#70401f"/>
  <text class="k" x="40" y="754.1" font-size="8.6" fill="#f4e2b8">THE SAME EIGHT STAGES ABOVE</text>
  <path class="wire" d="M 190 763.6 L 190 771.6" marker-end="url(#ar)"/>
  <rect x="28" y="773.6" width="324" height="24" rx="6" fill="#2d190e" stroke="#70401f"/>
  <text class="k" x="40" y="789.1" font-size="8.6" fill="#f4e2b8">FIREBASE PUBLISH / APPLE-COMPATIBLE FEED</text>
  <rect x="16" y="641.1" width="348" height="168.5" rx="8" fill="none" stroke="#70401f" stroke-dasharray="4 3"/>
  <text class="b" x="18" y="832.2" font-size="8.6" fill="#b99160">Stages run inside one private runtime: the Windows desktop, or the GitHub-hosted</text>
  <text class="b" x="18" y="844.2" font-size="8.6" fill="#b99160">machine. The newspaper is never derived from the audio script.</text>
</svg>
