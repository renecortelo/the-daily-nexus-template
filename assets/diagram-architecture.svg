<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 1181" width="380" height="1181" role="img" aria-labelledby="arch-t arch-d">
  <title id="arch-t">The Daily Nexus system architecture</title>
  <desc id="arch-d">A per-operator deployment, not a shared hosted service. The operator works from a Windows desktop application or an authenticated progressive web app. Control plane: the web app signs in through Firebase Authentication, reads and writes owner-locked Firestore, and synchronizes schedules or an immediate GEN wake-up with a Cloudflare Worker, whose Durable Object clock dispatches a GitHub Actions workflow in the operator's private repository when work is due. Content plane: generation runs either in the local Python runtime on Windows or in a GitHub-hosted Ubuntu Actions job, performing Gmail read-only collection, safe public-page enrichment, remote Antigravity editorial inference, quality validation, Kokoro and FFmpeg audio production, and ReportLab and PyMuPDF newspaper production. Desktop runs keep SQLite and filesystem state locally, while the Actions job claims and loads its work from Firestore. Publication goes to static Firebase Hosting, which serves the progressive web app shell and the capability-protected Apple Podcasts-compatible feed and media. After authentication the browser receives owner-scoped settings, status, references, transcript data and private media URLs, never generation credentials or raw Gmail bodies.</desc>
  <defs>
    <linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd27a"/><stop offset="0.45" stop-color="#ffb43b"/><stop offset="1" stop-color="#e0620f"/></linearGradient>
    <clipPath id="sc"><circle cx="0" cy="0" r="14.2"/></clipPath>
    <marker id="ar" viewBox="0 0 9 9" refX="8.4" refY="4.5" markerWidth="7.5" markerHeight="7.5" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.4,0.7 L8.4,4.5 L0.4,8.3 Z" fill="#f28c18"/></marker>
    <marker id="ac" viewBox="0 0 9 9" refX="8.4" refY="4.5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.4,0.7 L8.4,4.5 L0.4,8.3 Z" fill="#b99160"/></marker>
    <g id="sun">
      <circle cx="0" cy="0" r="16.5" fill="#0d0805" stroke="#f28c18" stroke-width="1.5"/>
      <g clip-path="url(#sc)">
        <circle cx="0" cy="0.5" r="11.5" fill="url(#sg)"/>
        <rect x="-15" y="2.2" width="30" height="1.5" fill="#0d0805"/>
        <rect x="-15" y="5.6" width="30" height="1.9" fill="#0d0805"/>
        <rect x="-15" y="9.4" width="30" height="2.3" fill="#0d0805"/>
        <line x1="-15" y1="-1.6" x2="15" y2="-1.6" stroke="#ffb43b" stroke-width="1"/>
      </g>
      <circle cx="-13.6" cy="-1.6" r="1.7" fill="#ffb43b"/>
      <circle cx="13.6" cy="-1.6" r="1.7" fill="#ffb43b"/>
    </g>
    <style>
      .dsp { font-family: Impact, Haettenschweiler, "Arial Narrow Bold", "Arial Narrow", sans-serif; letter-spacing: 0.04em; }
      .h { font-family: Consolas, "DejaVu Sans Mono", "Courier New", monospace; font-weight: 700; letter-spacing: 0.06em; }
      .k { font-family: Consolas, "DejaVu Sans Mono", "Courier New", monospace; letter-spacing: 0.06em; }
      .b { font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .acc { font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .wire { fill: none; stroke: #f28c18; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .ctl { fill: none; stroke: #b99160; stroke-width: 1.4; stroke-dasharray: 4 3; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="380" height="1181" fill="#110b07"/>
  <use href="#sun" x="34" y="36"/>
  <text class="dsp" x="60" y="31" font-size="17" fill="#fff0c7">THE DAILY NEXUS</text>
  <text class="k" x="61" y="46" font-size="8" fill="#b99160">SYSTEM ARCHITECTURE / ONE OPERATOR</text>
  <line x1="16" y1="60" x2="364" y2="60" stroke="#70401f"/>
  <text class="k" x="18" y="82.5" font-size="8.5" fill="#ffb43b">OPERATOR</text>
  <rect x="16" y="89.5" width="166" height="57.7" rx="8" fill="#21130c" stroke="#70401f"/>
  <text class="h" x="29" y="110" font-size="11" fill="#f4e2b8">DESKTOP APP</text>
  <text class="b" x="29" y="122.6" font-size="9" fill="#b99160">Windows. Runs generation locally.</text>
  <rect x="198" y="89.5" width="166" height="57.7" rx="8" fill="#21130c" stroke="#70401f"/>
  <text class="h" x="211" y="110" font-size="11" fill="#f4e2b8">WEB APP</text>
  <text class="b" x="211" y="122.6" font-size="9" fill="#b99160">Browser or iPhone. Signed-in</text>
  <text class="b" x="211" y="135.2" font-size="9" fill="#b99160">console.</text>
  <text class="b" x="18" y="163.8" font-size="8.6" fill="#b99160">One operator, one private deployment: separate accounts, separate private repository.</text>
  <text class="b" x="18" y="175.8" font-size="8.6" fill="#b99160">There is no shared multi-user service.</text>
  <text class="k" x="18" y="197.7" font-size="8.5" fill="#b99160">CONTROL PLANE / SCHEDULING</text>
  <rect x="26" y="208.7" width="328" height="45.1" rx="8" fill="#2d190e" stroke="#70401f"/>
  <text class="h" x="39" y="229.2" font-size="11" fill="#f4e2b8">FIREBASE AUTH</text>
  <text class="b" x="39" y="241.8" font-size="9" fill="#b99160">Google sign-in. The Firebase UID must match the owner document.</text>
  <path class="ctl" d="M 190 254.8 L 190 264.8" marker-end="url(#ac)"/>
  <rect x="26" y="266.8" width="328" height="57.7" rx="8" fill="#2d190e" stroke="#70401f"/>
  <text class="h" x="39" y="287.3" font-size="11" fill="#f4e2b8">OWNER-LOCKED FIRESTORE</text>
  <text class="b" x="39" y="299.9" font-size="9" fill="#b99160">Settings, schedules, queue and execution state, runner status, episode</text>
  <text class="b" x="39" y="312.5" font-size="9" fill="#b99160">metadata. The Actions job claims and loads its work here.</text>
  <path class="ctl" d="M 190 325.5 L 190 335.5" marker-end="url(#ac)"/>
  <rect x="26" y="337.5" width="328" height="57.7" rx="8" fill="#2d190e" stroke="#70401f"/>
  <text class="h" x="39" y="358" font-size="11" fill="#f4e2b8">CLOUDFLARE WORKER + CLOCK</text>
  <text class="b" x="39" y="370.6" font-size="9" fill="#b99160">Durable Object: schedule timing and opaque IDs.</text>
  <text class="b" x="39" y="383.2" font-size="9" fill="#b99160">Worker: the scoped, expiring dispatch token.</text>
  <path class="ctl" d="M 190 396.2 L 190 406.2" marker-end="url(#ac)"/>
  <rect x="26" y="408.2" width="328" height="45.1" rx="8" fill="#2d190e" stroke="#70401f"/>
  <text class="h" x="39" y="428.7" font-size="11" fill="#f4e2b8">GITHUB ACTIONS / PRIVATE REPO</text>
  <text class="b" x="39" y="441.3" font-size="9" fill="#b99160">Workflow dispatched only for due work or a GEN wake-up.</text>
  <rect x="16" y="204.7" width="348" height="260.6" rx="8" fill="none" stroke="#70401f" stroke-dasharray="4 3"/>
  <text class="k" x="18" y="489.8" font-size="8.5" fill="#ffb43b">CONTENT PLANE / GENERATION RUNTIME</text>
  <rect x="16" y="496.8" width="166" height="45.1" rx="8" fill="#21130c" stroke="#70401f"/>
  <text class="h" x="29" y="517.3" font-size="11" fill="#f4e2b8">WINDOWS DESKTOP</text>
  <text class="b" x="29" y="529.9" font-size="9" fill="#b99160">Local Python runtime.</text>
  <rect x="198" y="496.8" width="166" height="45.1" rx="8" fill="#21130c" stroke="#70401f"/>
  <text class="h" x="211" y="517.3" font-size="11" fill="#f4e2b8">GITHUB-HOSTED JOB</text>
  <text class="b" x="211" y="529.9" font-size="9" fill="#b99160">Ephemeral Ubuntu, private repo.</text>
  <path class="wire" d="M 99 542.9 L 99 554.9"/>
  <path class="wire" d="M 281 542.9 L 281 554.9"/>
  <path class="wire" d="M 99 554.9 L 281 554.9"/>
  <path class="wire" d="M 190 554.9 L 190 567.9" marker-end="url(#ar)"/>
  <rect x="16" y="569.9" width="348" height="45.1" rx="8" fill="#21130c" stroke="#70401f"/>
  <text class="h" x="29" y="590.4" font-size="11" fill="#f4e2b8">GMAIL COLLECTION</text>
  <text class="b" x="29" y="603" font-size="9" fill="#b99160">Read-only, the configured label and date.</text>
  <path class="wire" d="M 190 616 L 190 627" marker-end="url(#ar)"/>
  <rect x="16" y="629" width="348" height="45.1" rx="8" fill="#21130c" stroke="#70401f"/>
  <text class="h" x="29" y="649.5" font-size="11" fill="#f4e2b8">PUBLIC-PAGE ENRICHMENT</text>
  <text class="b" x="29" y="662.1" font-size="9" fill="#b99160">Allowed pages only, with safety checks.</text>
  <path class="wire" d="M 190 675.1 L 190 686.1" marker-end="url(#ar)"/>
  <rect x="16" y="688.1" width="348" height="45.1" rx="8" fill="#21130c" stroke="#70401f"/>
  <text class="h" x="29" y="708.6" font-size="11" fill="#f4e2b8">ANTIGRAVITY</text>
  <text class="b" x="29" y="721.2" font-size="9" fill="#b99160">Remote editorial inference.</text>
  <path class="wire" d="M 190 734.2 L 190 745.2" marker-end="url(#ar)"/>
  <rect x="16" y="747.2" width="348" height="45.1" rx="8" fill="#21130c" stroke="#70401f"/>
  <text class="h" x="29" y="767.7" font-size="11" fill="#f4e2b8">QUALITY VALIDATION</text>
  <text class="b" x="29" y="780.3" font-size="9" fill="#b99160">Facts, coverage, structure, repetition.</text>
  <path class="wire" d="M 190 793.3 L 190 804.3" marker-end="url(#ar)"/>
  <path class="wire" d="M 190 807.3 L 190 819.3"/>
  <path class="wire" d="M 99 819.3 L 281 819.3"/>
  <path class="wire" d="M 99 819.3 L 99 832.3" marker-end="url(#ar)"/>
  <path class="wire" d="M 281 819.3 L 281 832.3" marker-end="url(#ar)"/>
  <rect x="16" y="834.3" width="166" height="45.1" rx="8" fill="#21130c" stroke="#70401f"/>
  <text class="h" x="29" y="854.8" font-size="11" fill="#f4e2b8">AUDIO</text>
  <text class="b" x="29" y="867.4" font-size="9" fill="#b99160">Kokoro and FFmpeg.</text>
  <rect x="198" y="834.3" width="166" height="45.1" rx="8" fill="#21130c" stroke="#70401f"/>
  <text class="h" x="211" y="854.8" font-size="11" fill="#f4e2b8">NEWSPAPER</text>
  <text class="b" x="211" y="867.4" font-size="9" fill="#b99160">ReportLab and PyMuPDF.</text>
  <path class="wire" d="M 99 880.4 L 99 892.4"/>
  <path class="wire" d="M 281 880.4 L 281 892.4"/>
  <path class="wire" d="M 99 892.4 L 281 892.4"/>
  <text class="k" x="18" y="904.9" font-size="8.5" fill="#ffb43b">STATE AND DELIVERY</text>
  <path class="wire" d="M 190 892.4 L 190 924.9" marker-end="url(#ar)"/>
  <rect x="16" y="926.9" width="348" height="57.7" rx="8" fill="#21130c" stroke="#70401f"/>
  <text class="h" x="29" y="947.4" font-size="11" fill="#f4e2b8">LOCAL SQLITE + FILES</text>
  <text class="b" x="29" y="960" font-size="9" fill="#b99160">Desktop runs keep run state, episodes and checksums on the operator's own</text>
  <text class="b" x="29" y="972.6" font-size="9" fill="#b99160">machine.</text>
  <path class="wire" d="M 190 985.6 L 190 996.6" marker-end="url(#ar)"/>
  <rect x="16" y="998.6" width="348" height="45.1" rx="8" fill="#21130c" stroke="#70401f"/>
  <text class="h" x="29" y="1019.1" font-size="11" fill="#f4e2b8">FIREBASE HOSTING</text>
  <text class="b" x="29" y="1031.7" font-size="9" fill="#b99160">Web app shell, private RSS, MP3, PDF, artwork and public source links.</text>
  <path class="wire" d="M 190 1044.7 L 190 1055.7" marker-end="url(#ar)"/>
  <rect x="16" y="1057.7" width="348" height="45.1" rx="8" fill="#21130c" stroke="#70401f"/>
  <text class="h" x="29" y="1078.2" font-size="11" fill="#f4e2b8">APPLE PODCASTS / ANY CLIENT</text>
  <text class="b" x="29" y="1090.8" font-size="9" fill="#b99160">Fetches the capability-protected feed and media.</text>
  <text class="b" x="18" y="1125.4" font-size="8.6" fill="#b99160">After sign-in the browser receives owner-scoped settings, status, references, transcript</text>
  <text class="b" x="18" y="1137.4" font-size="8.6" fill="#b99160">data and private media URLs. It never receives generation credentials or raw Gmail</text>
  <text class="b" x="18" y="1149.4" font-size="8.6" fill="#b99160">bodies.</text>
  <path class="wire" d="M 20 1162.8 L 42 1162.8"/>
  <text class="k" x="48" y="1165.8" font-size="8.2" fill="#b99160">content and media</text>
  <path class="ctl" d="M 184 1162.8 L 206 1162.8"/>
  <text class="k" x="212" y="1165.8" font-size="8.2" fill="#b99160">control and scheduling</text>
</svg>
