<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 1614" width="380" height="1614" role="img" aria-labelledby="arch-t arch-d">
  <title id="arch-t">The Daily Nexus system architecture</title>
  <desc id="arch-d">A per-operator deployment, not a shared hosted service. Control plane: the web app signs in through Firebase Authentication, and once authenticated it talks separately to two services. It reads and writes owner-locked Firestore for settings, schedules, the queue, executions and status, and it synchronizes schedule timing or requests an immediate GEN wake-up with the Cloudflare clock. Cloudflare dispatches a GitHub Actions workflow in the operator's private repository. That workflow talks directly to Firestore to claim an execution, read its parameters and update its state, and it starts the GitHub-hosted Ubuntu generation runtime. Separately, the desktop application drives the local Windows runtime directly. Both runtimes then run the same content plane: Gmail read-only collection, safe public-page enrichment, remote Antigravity editorial inference, quality validation, and finally two parallel producers, Kokoro with FFmpeg for audio and ReportLab with PyMuPDF for the newspaper. Delivery then splits into two independent outcomes. A run can finish locally, where a desktop run keeps SQLite state, the manifest, MP3, PDF and transcript on the operator's machine while a GitHub-hosted run keeps nothing because its temporary files are removed. Independently, and only when publishing is enabled, the run releases to static Firebase Hosting, which serves the capability-protected Apple Podcasts-compatible feed and media. Firebase is not a required step for a local-only run.</desc>
